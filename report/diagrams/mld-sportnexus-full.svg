<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2550" viewBox="0 0 1800 2550">
<style>
body{font-family:Arial}.bg{fill:#f7fafc}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.head{fill:#1d4ed8}.title{font:700 32px Arial;fill:#172554}.sub{font:18px Arial;fill:#334155}.name{font:700 17px Arial;fill:#fff}.field{font:14px Arial;fill:#172033}.pk{font:700 14px Arial;fill:#b45309}.fk{font:700 14px Arial;fill:#047857}.note{font:15px Arial;fill:#475569}
</style>
<rect width="1800" height="2550" class="bg"/>
<text x="900" y="45" text-anchor="middle" class="title">MLD - MO HINH LOGIC DU LIEU SPORTNEXUS</text>
<text x="900" y="75" text-anchor="middle" class="sub">Day du 31 model trong schema.prisma - PK: khoa chinh - FK: khoa ngoai</text>
<!-- row 1 -->
<g transform="translate(30,110)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Permissions</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">slug UNIQUE, name</text><text x="12" y="101" class="field">module, action</text></g>
<g transform="translate(470,110)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Roles</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">slug UNIQUE, name</text><text x="12" y="101" class="field">permissions, Users</text></g>
<g transform="translate(910,110)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Users</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">full_name, email, password</text><text x="12" y="101" class="fk">FK role_id, tier_id</text></g>
<g transform="translate(1350,110)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">UserAddresses</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id</text><text x="12" y="101" class="field">recipient_name, location_data</text></g>
<!-- row 2 -->
<g transform="translate(30,280)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Categories</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name, slug, image</text><text x="12" y="101" class="field">is_active, deleted_at</text></g>
<g transform="translate(470,280)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Collections</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK category_id</text><text x="12" y="101" class="field">name, slug, banner</text></g>
<g transform="translate(910,280)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Suppliers</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name, contact_person</text><text x="12" y="101" class="field">email, phone, location_data</text></g>
<g transform="translate(1350,280)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Brands</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name, logo, origin</text><text x="12" y="101" class="field">deleted_at</text></g>
<!-- row 3 -->
<g transform="translate(30,450)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Products</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name, slug, base_price</text><text x="12" y="101" class="fk">FK category_id, supplier_id, brand_id</text></g>
<g transform="translate(470,450)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">ProductImages</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK product_id</text><text x="12" y="101" class="field">url, is_primary</text></g>
<g transform="translate(910,450)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">ProductVariants</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK product_id</text><text x="12" y="101" class="field">stock, price, deleted_at</text></g>
<g transform="translate(1350,450)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">AttributeKeys</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name UNIQUE, unit</text><text x="12" y="101" class="field">product and variable attributes</text></g>
<!-- row 4 -->
<g transform="translate(30,620)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">VariableAttributes</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK variable_id, attribute_key_id</text><text x="12" y="101" class="field">value, UNIQUE pair</text></g>
<g transform="translate(470,620)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">ProductAttributeKeys</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK product_id, attribute_key_id</text><text x="12" y="101" class="field">UNIQUE pair</text></g>
<g transform="translate(910,620)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Coupons</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">code UNIQUE, discount_value</text><text x="12" y="101" class="field">discount_type, dates, usage_limit</text></g>
<g transform="translate(1350,620)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">UserCoupons</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id, coupon_id</text><text x="12" y="101" class="field">used_count, is_gift, quantity</text></g>
<!-- row 5 -->
<g transform="translate(30,790)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Invoices</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK order_id UNIQUE</text><text x="12" y="101" class="field">invoice_number, VAT, total_amount</text></g>
<g transform="translate(470,790)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Orders</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK usersId, coupon_code</text><text x="12" y="101" class="field">status, payment_status, amounts</text></g>
<g transform="translate(910,790)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">PaymentTransactions</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK order_id</text><text x="12" y="101" class="field">method, amount, status, provider_ref</text></g>
<g transform="translate(1350,790)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">OrderItems</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK order_id, product_variant_id</text><text x="12" y="101" class="field">quantity, price_at_purchase</text></g>
<!-- row 6 -->
<g transform="translate(30,960)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Carts</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id</text><text x="12" y="101" class="field">updated_at</text></g>
<g transform="translate(470,960)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">CartItems</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK cart_id, product_variant_id</text><text x="12" y="101" class="field">quantity, UNIQUE pair</text></g>
<g transform="translate(910,960)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Reviews</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id, order_id, product_id</text><text x="12" y="101" class="field">rating, comment, media_urls</text></g>
<g transform="translate(1350,960)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">StockMovements</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK variant_id</text><text x="12" y="101" class="field">type, quantity_change, reference_id</text></g>
<!-- row 7 -->
<g transform="translate(30,1130)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">PurchaseOrders</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK supplier_id</text><text x="12" y="101" class="field">order_date, status, total_cost</text></g>
<g transform="translate(470,1130)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">PurchaseOrderItems</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK purchase_order_id, product_variant_id</text><text x="12" y="101" class="field">quantity, unit_cost_price, received</text></g>
<g transform="translate(910,1130)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">SystemLogs</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id optional</text><text x="12" y="101" class="field">action_type, entity_type, details</text></g>
<g transform="translate(1350,1130)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">MembershipTiers</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">name, min_spent, reward_rate</text><text x="12" y="101" class="field">discount_percent, sort_order</text></g>
<!-- row 8 -->
<g transform="translate(30,1300)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">PointTransactions</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK user_id, order_id, coupon_id</text><text x="12" y="101" class="field">type, points, balance_after</text></g>
<g transform="translate(470,1300)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">TierRewards</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="fk">FK tier_id</text><text x="12" y="101" class="field">name, point_cost, coupon_code</text></g>
<g transform="translate(910,1300)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">LoyaltySettings</text><text x="12" y="55" class="pk">PK id</text><text x="12" y="78" class="field">key UNIQUE</text><text x="12" y="101" class="field">value, updated_at</text></g>
<g transform="translate(1350,1300)"><rect width="400" height="130" class="box"/><rect width="400" height="32" class="head"/><text x="200" y="22" text-anchor="middle" class="name">Implicit join tables</text><text x="12" y="55" class="field">Roles-Permissions</text><text x="12" y="78" class="field">Users-Permissions</text><text x="12" y="101" class="field">Users-Roles / Users-TierRewards</text></g>
<!-- relationship notes -->
<rect x="30" y="1500" width="1720" height="360" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="1540" class="title" style="font-size:23px">Quan he logic chu yeu</text>
<text x="60" y="1580" class="note">Users 1-N UserAddresses, Orders, Carts, Reviews, PointTransactions, SystemLogs</text>
<text x="60" y="1615" class="note">Categories 1-N Products va Collections; Suppliers 1-N Products va PurchaseOrders; Brands 1-N Products</text>
<text x="60" y="1650" class="note">Products 1-N ProductImages, ProductVariants, Reviews; ProductVariants 1-N OrderItems, CartItems, StockMovements</text>
<text x="60" y="1685" class="note">Orders 1-N OrderItems va PaymentTransactions; Orders 1-1 Invoices; Orders co the lien ket Coupons</text>
<text x="60" y="1720" class="note">PurchaseOrders 1-N PurchaseOrderItems; MembershipTiers 1-N Users va TierRewards</text>
<text x="60" y="1755" class="note">Bang trung gian xu ly quan he N-N: UserCoupons, CartItems, ProductAttributeKeys va quan he role/permission</text>
<text x="60" y="1815" class="note">Luu y: schema.prisma hien co 31 model tuong ung; so bang MySQL co the tang do cac bang lien ket N-N do Prisma sinh ra.</text>
<!-- lower technical tables -->
<text x="900" y="1930" text-anchor="middle" class="title" style="font-size:24px">Nhom enum va rang buoc vat ly</text>
<g transform="translate(100,1980)"><rect width="500" height="230" class="box"/><rect width="500" height="32" class="head"/><text x="250" y="22" text-anchor="middle" class="name">Enums</text><text x="15" y="65" class="field">OrderStatus: Processing, Shipping, Delivered</text><text x="15" y="95" class="field">PaymentMethod: COD, BANK_TRANSFER, MOMO</text><text x="15" y="125" class="field">PaymentStatus: Pending, Paid, Failed, Refunded</text><text x="15" y="155" class="field">DiscountType, InvoiceStatus, TypeStock</text><text x="15" y="185" class="field">StatusPurchaseOrders, LogStatus</text></g>
<g transform="translate(650,1980)"><rect width="500" height="230" class="box"/><rect width="500" height="32" class="head"/><text x="250" y="22" text-anchor="middle" class="name">Constraints</text><text x="15" y="65" class="field">PK auto increment tren cac bang</text><text x="15" y="95" class="field">Unique: email, slug, code, invoice_number</text><text x="15" y="125" class="field">Unique composite cho cac bang trung gian</text><text x="15" y="155" class="field">Index payment_transactions.order_id</text><text x="15" y="185" class="field">Cascade delete theo quan he da khai bao</text></g>
<g transform="translate(1200,1980)"><rect width="500" height="230" class="box"/><rect width="500" height="32" class="head"/><text x="250" y="22" text-anchor="middle" class="name">Mapping MySQL</text><text x="15" y="65" class="field">Int -> INT, Decimal -> DECIMAL</text><text x="15" y="95" class="field">String -> VARCHAR/TEXT</text><text x="15" y="125" class="field">DateTime -> DATETIME</text><text x="15" y="155" class="field">Json -> JSON, Boolean -> BOOLEAN</text><text x="15" y="185" class="field">@@map xac dinh ten bang vat ly</text></g>
<text x="900" y="2310" text-anchor="middle" class="sub">Hinh nay dung lam MLD day du trong bao cao; hinh erd.png/erd.svg dung lam MPD tham khao neu da dong bo database.</text>
<text x="900" y="2350" text-anchor="middle" class="sub">Nen chia hinh thanh cac nhom khi in Word de bao dam kich thuoc chu co the doc duoc.</text>
</svg>
