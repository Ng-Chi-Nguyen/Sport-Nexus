<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <style>
    .tbl{fill:#fff;stroke:#195a8d;stroke-width:3}.head{fill:#195a8d}.line{stroke:#777;stroke-width:3}.title{font:700 30px Arial;fill:#17324d}.name{font:700 18px Arial;fill:#fff}.text{font:16px Arial;fill:#123}.key{font:700 16px Arial;fill:#9a3412}
  </style>
  <rect width="1800" height="1200" fill="#f8fbff"/>
  <text x="900" y="45" text-anchor="middle" class="title">MLD - Mo hinh logic du lieu SportNexus</text>
  <text x="900" y="75" text-anchor="middle" class="text">Bang logic, khoa chinh PK, khoa ngoai FK va quan he</text>
  <line x1="245" y1="230" x2="390" y2="230" class="line"/><line x1="650" y1="230" x2="800" y2="230" class="line"/><line x1="1060" y1="230" x2="1210" y2="230" class="line"/>
  <line x1="245" y1="560" x2="390" y2="560" class="line"/><line x1="650" y1="560" x2="800" y2="560" class="line"/><line x1="1060" y1="560" x2="1210" y2="560" class="line"/>
  <line x1="245" y1="890" x2="390" y2="890" class="line"/><line x1="650" y1="890" x2="800" y2="890" class="line"/><line x1="1060" y1="890" x2="1210" y2="890" class="line"/>
  <line x1="520" y1="320" x2="520" y2="470" class="line"/><line x1="930" y1="320" x2="930" y2="470" class="line"/><line x1="1340" y1="320" x2="1340" y2="470" class="line"/>
  <g transform="translate(35,130)"><rect width="210" height="200" class="tbl"/><rect width="210" height="38" class="head"/><text x="105" y="26" text-anchor="middle" class="name">USERS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">full_name</text><text x="12" y="121" class="text">email, password</text><text x="12" y="148" class="text">role_id FK</text><text x="12" y="175" class="text">tier_id FK</text></g>
  <g transform="translate(390,130)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">PRODUCTS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">name, slug</text><text x="12" y="121" class="text">base_price</text><text x="12" y="148" class="text">category_id FK</text><text x="12" y="175" class="text">brand_id, supplier_id FK</text></g>
  <g transform="translate(800,130)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">PRODUCT_VARIANTS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">stock, price</text><text x="12" y="121" class="text">product_id FK</text><text x="12" y="148" class="text">deleted_at</text></g>
  <g transform="translate(1210,130)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">ORDERS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">total_amount</text><text x="12" y="121" class="text">status, payment_status</text><text x="12" y="148" class="text">usersId FK</text><text x="12" y="175" class="text">coupon_code FK</text></g>
  <g transform="translate(35,460)"><rect width="210" height="200" class="tbl"/><rect width="210" height="38" class="head"/><text x="105" y="26" text-anchor="middle" class="name">CARTS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">user_id FK</text><text x="12" y="121" class="text">updated_at</text></g>
  <g transform="translate(390,460)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">ORDER_ITEMS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">order_id FK</text><text x="12" y="121" class="text">product_variant_id FK</text><text x="12" y="148" class="text">quantity</text><text x="12" y="175" class="text">price_at_purchase</text></g>
  <g transform="translate(800,460)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">PAYMENT_TRANSACTIONS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">order_id FK</text><text x="12" y="121" class="text">method, amount</text><text x="12" y="148" class="text">status, provider_ref</text><text x="12" y="175" class="text">paid_at</text></g>
  <g transform="translate(1210,460)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">INVOICES</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">order_id FK UNIQUE</text><text x="12" y="121" class="text">invoice_number</text><text x="12" y="148" class="text">subtotal, vat_amount</text><text x="12" y="175" class="text">total_amount, status</text></g>
  <g transform="translate(35,790)"><rect width="210" height="200" class="tbl"/><rect width="210" height="38" class="head"/><text x="105" y="26" text-anchor="middle" class="name">COUPONS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">code UNIQUE</text><text x="12" y="121" class="text">discount_value</text><text x="12" y="148" class="text">start_date, end_date</text></g>
  <g transform="translate(390,790)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">USER_COUPONS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">user_id FK</text><text x="12" y="121" class="text">coupon_id FK</text><text x="12" y="148" class="text">used_count, quantity</text></g>
  <g transform="translate(800,790)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">STOCK_MOVEMENTS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">variant_id FK</text><text x="12" y="121" class="text">type, quantity_change</text><text x="12" y="148" class="text">reference_id</text></g>
  <g transform="translate(1210,790)"><rect width="260" height="200" class="tbl"/><rect width="260" height="38" class="head"/><text x="130" y="26" text-anchor="middle" class="name">REVIEWS</text><text x="12" y="65" class="key">PK id</text><text x="12" y="94" class="text">user_id, order_id FK</text><text x="12" y="121" class="text">product_id FK</text><text x="12" y="148" class="text">rating, comment</text></g>
  <text x="900" y="1080" text-anchor="middle" class="text">MLD tap trung vao quan he, PK/FK va bang trung gian; chua di sau vao cau hinh vat ly MySQL</text>
</svg>
